# Instruções para o Repositório de Build no GitHub (REAL BUILD com Rush)
# Você deve criar um repositório no GitHub para servir de 'fábrica'.
# Adicione este arquivo em: .github/workflows/build.yml

name: AIX Builder (Rush)
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Rush CLI
        run: |
          curl -L https://raw.githubusercontent.com/shreyashsaitwal/rush-cli/main/scripts/install/install.sh | bash
          echo "$HOME/.rush/bin" >> $GITHUB_PATH

      - name: Build Extension
        run: |
          rush build --verbose
          
      - name: Check Output (Debug)
        run: |
          echo "Verificando arquivos gerados..."
          ls -R
          
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: "**/out/*.aix"  # Nota as duas estrelas: procura em qualquer lugar dentro de out
          if-no-files-found: error
