# Instruções para o Repositório de Build no GitHub (REAL BUILD com Rush)
# Você deve criar um repositório no GitHub para servir de 'fábrica'.
# Adicione este arquivo em: .github/workflows/build.yml

name: AIX Builder (Rush)
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Rush CLI
        run: |
          # Baixa o executável do Rush diretamente dos assets da release
          # O nome do asset para Linux no repositório oficial é geralmente apenas 'rush'
          curl -L https://github.com/shreyashsaitwal/rush-cli/releases/latest/download/rush -o rush
          
          # Verifica se o download foi bem sucedido (evita o erro 'Not found')
          if grep -q "Not Found" rush; then
            echo "Erro: O link de download do Rush falhou (404). Tentando método alternativo..."
            curl -L https://github.com/shreyashsaitwal/rush-cli/releases/download/v1.2.5/rush -o rush
          fi
          
          chmod +x rush
          sudo mv rush /usr/local/bin/rush

      - name: Build Extension
        run: |
          # Garante que estamos na raiz do projeto onde está o rush.yml
          rush build --verbose
          
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: out/*.aix
