name: AIX Builder
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Build Extension
        run: |
          # Instrução: Este é um template simplificado.
          # No seu repo real, você deve ter a estrutura do MIT App Inventor ou ferramentas como 'Rush'.
          
          echo "Simulando build de AIX..."
          # Mock: Cria um arquivo apenas para testar o upload
          mkdir -p out
          touch out/extension.aix
          
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: out/*.aix
