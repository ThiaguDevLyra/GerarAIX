name: AIX Builder (Rush)
on:
  push:
    paths:
      - 'src/**'
      - 'rush.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Rush CLI (Binary)
        run: |
          # Baixando a versão estável mais recente do Rush
          curl -L -o rush https://github.com/shreyashsaitwal/rush-cli/releases/latest/download/rush-linux
          chmod +x rush
          sudo mv rush /usr/local/bin/rush
          rush --version

      - name: Build Extension
     - run: |
          # O Rush precisa de um arquivo rush.yml válido na raiz
          rush build --verbose

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-aix
          path: out/*.aix
