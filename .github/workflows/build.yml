name: AIX Builder (Rush)
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Rush CLI
        run: |
          # Usa o script oficial que baixa o binário pré-compilado
          curl -L https://raw.githubusercontent.com/shreyashsaitwal/rush-cli/main/scripts/install/install.sh | bash
          echo "$HOME/.rush/bin" >> $GITHUB_PATH

      - name: Build Extension
        run: |
          # O comando rush build agora deve ser reconhecido
          rush build --verbose
          
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: out/*.aix
