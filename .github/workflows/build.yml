name: Build AIX
on:
  push:
    paths:
      - 'src/**'
      - 'rush.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Rush
        run: |
          curl -L https://github.com/shreyashsaitwal/rush-cli/releases/latest/download/rush -o rush
          chmod +x rush
          sudo mv rush /usr/local/bin/

      - name: Build with Rush
        run: rush build

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-AIX
          path: out/*.aix
