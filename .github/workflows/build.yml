# Instruções para o Repositório de Build no GitHub (REAL BUILD com Rush)
# Você deve criar um repositório no GitHub para servir de 'fábrica'.
# Adicione este arquivo em: .github/workflows/build.yml

name: AIX Builder (Rush)
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Rush CLI
        run: dart pub global activate rush_cli

      - name: Build Extension
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          # DEBUG: Mostrar estrutura de arquivos para verificar se o Rush encontra tudo
          ls -R
          rush build --verbose
          
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: out/*.aix
