name: Real AIX Builder
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Rush
        run: |
          curl -fsSL https://raw.githubusercontent.com/shreyashsaitwal/rush-cli/main/scripts/install/install.sh | bash
          echo "$HOME/.rush/bin" >> $GITHUB_PATH

      - name: Build Extension
        run: |
          # O comando 'rush build' compila o código Java em um .aix real
          rush build
          
      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-Package
          path: out/*.aix
