# Instruções para o Repositório de Build no GitHub (REAL BUILD com Rush)
# Você deve criar um repositório no GitHub para servir de 'fábrica'.
# Adicione este arquivo em: .github/workflows/build.yml

name: AIX Builder (Rush)
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Rush CLI
        run: |
          # Baixa a versão 1.2.5 (estável) do Rush
          curl -L https://github.com/shreyashsaitwal/rush-cli/releases/download/v1.2.5/rush-linux -o rush
          chmod +x rush
          sudo mv rush /usr/local/bin/rush

      - name: Build Extension
        run: |
          # O comando 'rush build' agora deve funcionar diretamente
          rush build --verbose
          
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: out/*.aix
